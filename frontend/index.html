<html lang="zh-CN">

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        min-width: 1200px;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,

        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #161618;

        background: #3B82F6;
